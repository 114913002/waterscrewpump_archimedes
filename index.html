<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿基米德螺旋抽水器探究實驗室</title>
<style>
    body {
        font-family: "微軟正黑體", Arial, sans-serif;
        background: #d9c49f;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        box-sizing: border-box;
    }
    .polis-backdrop {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: .8;
        pointer-events: none;
    }
    h1 { text-align: center; }
    .container {
        position: relative;
        z-index: 1;
        margin: 0 auto;
        max-width: 900px;
        background: rgba(255, 252, 244, .95);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .video-container, .next-button, .back-button { text-align: center; }
    .student-fields {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        max-width: 620px;
        margin: 20px auto 0;
        text-align: left;
    }
    .student-fields label { display: grid; gap: 6px; }
    .student-fields input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #bbb;
        border-radius: 4px;
        font: inherit;
    }
    @media (max-width: 560px) {
        .student-fields { grid-template-columns: 1fr; }
    }
    .next-button, .back-button, #start-button, #discuss-results, #retry-button, #export-results, #export-pdf {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #4a90e2;
        color: white;
    }
    #export-results, #export-pdf { background: #34495e; }
    #retry-button { background: #27ae60; }
    #discuss-results:disabled { background: #aaa; cursor: not-allowed; }

    /* ================= 阿基米德螺旋泵浦場景 ================= */
    .pump-scene {
        position: relative;
        width: min(100%, 520px);
        aspect-ratio: 520 / 330;
        box-sizing: border-box;
        margin: 20px auto;
        background: linear-gradient(to bottom, #c8e8f4 0%, #e9f5f4 67%, #b99a6a 67%, #b99a6a 100%);
        border: 2px solid #70553b;
        border-radius: 10px;
        overflow: hidden;
    }
    .scene-sun {
        position: absolute;
        top: 25px;
        left: 35px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #f6ce75;
        box-shadow: 0 0 0 10px rgba(246, 206, 117, .18);
    }
    /* 底部蓄水船 */
    .water-basin {
        position: absolute;
        z-index: 2;
        left: 2.3%;
        bottom: 4.5%;
        width: 24%;
        height: 17.6%;
        background: linear-gradient(to bottom, #65bee7 0 43%, #865635 44% 100%);
        border: 3px solid #553b28;
        border-radius: 12px 12px 42px 42px;
        clip-path: polygon(0 0, 100% 0, 88% 75%, 72% 100%, 22% 100%, 8% 75%);
        box-shadow: inset 0 -9px 0 rgba(53, 34, 19, .2);
    }
    .water-basin::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 12px;
        width: 95px;
        height: 5px;
        background: rgba(255,255,255,.7);
        border-radius: 50%;
        box-shadow: 32px 9px 0 -1px rgba(255,255,255,.4), 4px 18px 0 -1px rgba(255,255,255,.32);
    }
    .boat-label {
        position: absolute;
        left: 5%;
        bottom: 5.1%;
        z-index: 3;
        color: #fff8df;
        font-size: 11px;
        font-weight: bold;
        text-shadow: 0 1px 2px #342516;
    }
    /* 上方蓄水庫 */
    .reservoir {
        position: absolute;
        z-index: 1;
        right: 11.5%;
        top: 5.5%;
        width: 23.8%;
        height: 22.4%;
        box-sizing: border-box;
        border: 4px solid #67503b;
        border-top-width: 7px;
        border-radius: 5px 5px 15px 15px;
        background: linear-gradient(to bottom, #e9dcc0 0 35%, #54aed3 36% 100%);
        box-shadow: inset 0 0 0 4px rgba(255,255,255,.22), 4px 5px 0 rgba(78,57,37,.18);
    }
    .reservoir::before {
        content: "";
        position: absolute;
        left: -8px;
        right: -8px;
        top: 20px;
        height: 5px;
        background: rgba(255,255,255,.7);
        border-radius: 50%;
        box-shadow: 30px 16px 0 -1px rgba(255,255,255,.4), 67px 5px 0 -1px rgba(255,255,255,.35);
    }
    .reservoir-label {
        position: absolute;
        z-index: 2;
        right: 14%;
        top: 7.6%;
        color: #493b2c;
        font-size: 12px;
        font-weight: bold;
    }
    /* 傾斜外管的旋轉容器：pivot 在取水槽右上角 */
    .pump-tube-wrapper {
        position: absolute;
        z-index: 3;
        left: 17.7%;
        top: 83.6%;
        width: 65.4%;
        height: 0;
        transform-origin: 0% 50%;
        transform: rotate(-45deg); /* 由 JS 依角度即時更新 */
    }
    .pump-tube {
        position: absolute;
        left: 0;
        top: -22px;
        width: 100%;
        height: 44px;
        border: 4px solid #3e2a17;
        background: #b3835a;
        border-radius: 22px;
        overflow: hidden;
        box-sizing: border-box;
    }
    .screw-thread {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(120deg, #d8b785 0 5px, #81532f 5px 10px, #d8b785 10px 14px, #a16f43 14px 22px);
        background-size: 34px 100%;
    }
    .screw-thread::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 2px;
        right: 2px;
        height: 7px;
        transform: translateY(-50%);
        border-radius: 4px;
        background: linear-gradient(to bottom, #ead2a4, #634226 48%, #b98a58);
        box-shadow: 0 1px 2px rgba(37, 24, 12, .7);
    }
    .running .screw-thread {
        animation: threadMove linear infinite;
        animation-duration: var(--dur, 1.5s);
    }
    @keyframes threadMove {
        from { background-position: 0 0; }
        to   { background-position: 204px 0; }
    }
    /* 出水口（隨管子一起旋轉，永遠在管子末端） */
    .outlet-cup {
        position: absolute;
        left: 93.5%;
        top: -34px;
        width: 34px;
        height: 26px;
        background: #5b3a20;
        border: 3px solid #2e1c0c;
        border-radius: 6px 6px 14px 14px;
    }
    /* 水滴：沿管子局部座標從左(取水端)移到右(出水端) */
    .water-drop {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #cdeeff, #2f8fdb);
        top: 50%;
        margin-top: -6px;
        left: 14px;
        opacity: 0;
    }
    .running .water-drop {
        animation: carryUp linear infinite;
        animation-duration: var(--dur, 1.5s);
    }
    .water-drop:nth-child(4) { animation-delay: calc(var(--dur, 1.5s) / 3 * 1); }
    .water-drop:nth-child(5) { animation-delay: calc(var(--dur, 1.5s) / 3 * 2); }
    @keyframes carryUp {
        0%   { left: 14px;  opacity: 0; }
        8%   { opacity: 1; }
        90%  { opacity: 1; }
        100% { left: 92.4%; opacity: 0; }
    }
    /* 底部手搖馬達 */
    .crank-motor {
        position: absolute;
        z-index: 4;
        left: 17.7%;
        top: 83.6%;
        width: 6%;
        height: auto;
        aspect-ratio: 1;
        margin-left: -3%;
        margin-top: -3%;
        border-radius: 50%;
        background: #c0392b;
        border: 3px solid #7b1f1f;
    }
    .crank-motor::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 3px;
        width: 4px;
        height: 11px;
        background: #7b1f1f;
        transform: translateX(-50%);
    }
    .crank-motor.running {
        animation: spin linear infinite;
        animation-duration: var(--dur, 1.5s);
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    table, th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }

    /* ===== 全螢幕警示 ===== */
    .warning-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255,255,255,0.97);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    .warning-box {
        text-align: center;
        max-width: 500px;
        padding: 40px;
        border: 3px solid #e74c3c;
        border-radius: 12px;
        background: white;
    }
    .warning-box h2 { color: #e74c3c; }

    .archimedes-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(32, 43, 49, .72);
    }
    .archimedes-card {
        width: min(560px, 100%);
        padding: 28px 30px 30px;
        border: 2px solid #e5c68e;
        border-radius: 26px;
        background:
            radial-gradient(circle at 12% 12%, rgba(250, 222, 154, .32) 0 3px, transparent 4px),
            #fffaf0;
        box-shadow: 0 18px 50px rgba(25, 34, 40, .32), inset 0 0 0 7px rgba(255, 255, 255, .75);
        text-align: center;
    }
    .archimedes-card h2 {
        margin: 0 0 14px;
        color: #65492f;
        font-size: 25px;
        letter-spacing: .04em;
    }
    .archimedes-sketch {
        display: block;
        width: 190px;
        height: 190px;
        margin: 0 auto 10px;
        filter: drop-shadow(0 7px 5px rgba(93, 66, 42, .12));
    }
    .archimedes-speech {
        display: inline-block;
        position: relative;
        max-width: 420px;
        margin: 4px auto 18px;
        padding: 15px 22px;
        border: 2px solid #e7c57f;
        border-radius: 20px;
        background: #fff;
        color: #382b20;
        font-size: 19px;
        font-weight: bold;
        line-height: 1.5;
        box-shadow: 0 4px 0 rgba(190, 146, 72, .12);
    }
    .archimedes-speech::before {
        content: "";
        position: absolute;
        top: -9px;
        left: calc(50% - 8px);
        width: 14px;
        height: 14px;
        transform: rotate(45deg);
        border-top: 2px solid #e7c57f;
        border-left: 2px solid #e7c57f;
        background: white;
    }
    .archimedes-card button {
        padding: 11px 24px;
        border: 0;
        border-radius: 999px;
        background: #4a8068;
        color: white;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 #32604d;
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .archimedes-card button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 #32604d;
    }
    .archimedes-card button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #32604d;
    }
    @media (max-width: 520px) {
        .archimedes-card { padding: 22px 18px 24px; }
        .archimedes-sketch { width: 168px; height: 168px; }
        .archimedes-speech { font-size: 17px; }
    }
    @media (max-width: 520px) {
    .pump-scene { min-height: 190px; }
    }
    .charts-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
        margin-top: 20px;
    }
</style>
</head>
<body>
<svg class="polis-backdrop" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

<div class="container">
    <h1>阿基米德螺旋抽水器探究實驗室</h1>

    <!-- 階段1：介紹影片 -->
    <div class="video-container" id="intro">
        <h2>階段 1：認識螺旋抽水器</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/A-xPRbj88V4" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <br>
        <form id="student-info-form">
            <div class="student-fields">
                <label for="student-class">班級
                    <input id="student-class" name="student-class" type="text" autocomplete="organization-title" required>
                </label>
                <label for="student-seat">座號
                    <input id="student-seat" name="student-seat" type="number" min="1" step="1" inputmode="numeric" required>
                </label>
                <label for="student-name">姓名
                    <input id="student-name" name="student-name" type="text" autocomplete="name" required>
                </label>
            </div>
            <button class="next-button" id="enter-lab" type="submit">進入實驗室</button>
        </form>
    </div>

    <!-- 階段2：操作模擬 -->
    <div id="experiment" style="display:none;">
        <h2>階段 2：操作模擬</h2>

        <div class="pump-scene" id="pump-scene">
            <div class="scene-sun" aria-hidden="true"></div>
            <div class="water-basin"></div>
            <span class="boat-label">積水的小船</span>
            <div class="reservoir" aria-hidden="true"></div>
            <span class="reservoir-label">上方水庫</span>
            <div class="pump-tube-wrapper" id="pump-tube-wrapper">
                <div class="pump-tube" id="pump-tube">
                    <div class="screw-thread"></div>
                </div>
                <div class="outlet-cup"></div>
                <div class="water-drop"></div>
                <div class="water-drop"></div>
                <div class="water-drop"></div>
            </div>
            <div class="crank-motor" id="crank-motor"></div>
        </div>

        <label for="angle">幫浦與地面夾角:</label>
        <select id="angle">
            <option value="30">30度</option>
            <option value="45" selected>45度</option>
            <option value="60">60度</option>
        </select>
        <br><br>
        <label for="speed">轉速:</label>
        <select id="speed">
            <option value="low" selected>低速</option>
            <option value="medium">中速</option>
            <option value="high">高速</option>
        </select>
        <br><br>
        <label for="diameter">管徑半徑:</label>
        <select id="diameter">
            <option value="2">2 公尺</option>
            <option value="4">4 公尺</option>
            <option value="6" selected>6 公尺</option>
        </select>
        <br>
        <button id="start-button">啟動</button>

        <div id="results" style="display:none;">
            <h3>實驗數據紀錄</h3>
            <table id="data-table">
                <thead>
                    <tr>
                        <th>實驗編號</th>
                        <th>夾角 (度)</th>
                        <th>轉速</th>
                        <th>半徑 (公尺)</th>
                        <th>輸水效率 (%)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <p id="hint" style="color:#888;">完成至少 3 次實驗才能進入結果討論區</p>
            <button id="discuss-results" disabled>進入結果討論區</button>
            <button id="export-results" type="button">下載實驗紀錄 PDF</button>
        </div>
    </div>

    <!-- 階段3：結果討論區 -->
    <div id="discussion" style="display:none;">
        <h2>階段 3：結果討論區</h2>
        <div class="charts-grid">
            <div><h3>夾角 vs 輸水效率</h3><canvas id="chart-angle"></canvas></div>
            <div><h3>轉速 vs 輸水效率</h3><canvas id="chart-speed"></canvas></div>
            <div><h3>半徑 vs 輸水效率</h3><canvas id="chart-radius"></canvas></div>
        </div>
        <div style="text-align:center;">
            <button id="export-pdf" type="button">下載實驗紀錄 PDF</button>
            <button id="retry-button">🔁 再試一次</button>
        </div>
    </div>
</div>

<div class="archimedes-overlay" id="archimedes-overlay" role="dialog" aria-modal="true" aria-labelledby="archimedes-title">
    <div class="archimedes-card">
        <h2 id="archimedes-title">阿基米德的小提醒</h2>

                <path d="M103 101q-5 10 1 12" fill="none" stroke-width="2"/>
                <path d="M94 119q10 9 21 0" fill="none" stroke="#a85046" stroke-width="2.5"/>
                <path d="M78 115q4 17 20 20l2-10 4 10q17-5 20-20-12 7-23 0-11 7-23 0z" fill="#f2eee3" stroke-width="2"/>
                <path d="M69 142q-12 7-18 22m78-22q13 7 19 22" fill="none" stroke-width="6"/>
                <path d="M49 161q-5 4-3 11l15 3q5-3 3-8l-7-7z" fill="#f1bd83" stroke-width="2.5"/>
                <path d="M152 160q5 4 3 11l-15 4q-5-3-3-8l7-8z" fill="#f1bd83" stroke-width="2.5"/>
                <path d="M48 172q5 3 12-1m83 2q-5 3-12-1" fill="none" stroke-width="2"/>
            </g>
            <g transform="translate(145 107) rotate(17)">
                <rect x="0" y="0" width="17" height="47" rx="7" fill="#b77c48" stroke="#765034" stroke-width="2.5"/>
                <path d="M3 8q11-9 11 0t-11 9 11 9-11 9 11 8" fill="none" stroke="#f5d59e" stroke-width="3"/>
                <path d="M-2 4v-6m21 6v-6m-21 51v6m21-6v6" fill="none" stroke="#765034" stroke-width="3" stroke-linecap="round"/>
            </g>
        </svg>
        <div class="archimedes-speech">操縱變因、控制變因、應變變因要搞清楚喔!</div>
        <br>
        <button type="button" id="enter-lab-confirm">我記住了，進入實驗室</button>
    </div>
</div>

<!-- 全螢幕警示視窗 -->
<div class="warning-overlay" id="warning-overlay">
    <div class="warning-box">
        <h2>⚠️ 提醒</h2>
        <p>你現在想要探討哪一個變因對輸水效率的影響呢?</p>
        <button class="back-button" id="continue-button">返回實驗室</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
let experimentCount = 0;
let experiments = [];
let failedAttempts = 0;
let returnCount = 0;
let activityLog = [];
let studentInfo = { className: '', seatNumber: '', name: '' };
let lastParams = null;
let chartInstances = []; // 用於重繪時銷毀舊圖表

/* 效率計算：純函數，同參數必得同結果 */
const ANGLE_SCORE    = { "30": 0.75, "45": 1.00, "60": 0.85 };
const SPEED_SCORE     = { "low": 1.00, "medium": 0.75, "high": 0.55 };
const DIAMETER_SCORE  = { "2": 0.60, "4": 0.80, "6": 1.00 };
function computeEfficiency(angle, speed, diameter) {
    const score = ANGLE_SCORE[angle] * SPEED_SCORE[speed] * DIAMETER_SCORE[diameter];
    return Math.round(90 * score);
}

const SPEED_DURATION = { "low": "2.4s", "medium": "1.4s", "high": "0.8s" };
const THICKNESS_MAP  = { "2": 26, "4": 36, "6": 46 };

/* 依目前選擇的角度/管徑，即時更新示意圖外觀 */
function updatePumpVisual() {
    const angle = document.getElementById('angle').value;
    const diameter = document.getElementById('diameter').value;

    document.getElementById('pump-tube-wrapper').style.transform = `rotate(-${angle}deg)`;

    const thickness = Math.max(14, THICKNESS_MAP[diameter] * document.getElementById('pump-scene').clientWidth / 520);
    const tube = document.getElementById('pump-tube');
    tube.style.height = thickness + 'px';
    tube.style.top = (-thickness / 2) + 'px';
    tube.style.borderRadius = (thickness / 2) + 'px';
}
document.getElementById('angle').addEventListener('change', updatePumpVisual);
document.getElementById('diameter').addEventListener('change', updatePumpVisual);
window.addEventListener('DOMContentLoaded', updatePumpVisual);

document.getElementById('student-info-form').onsubmit = function(event) {
    event.preventDefault();
    studentInfo = {
        className: document.getElementById('student-class').value.trim(),
        seatNumber: document.getElementById('student-seat').value.trim(),
        name: document.getElementById('student-name').value.trim()
    };
    if (!studentInfo.className || !studentInfo.seatNumber || !studentInfo.name) {
        alert('請完整填寫班級、座號與姓名後再進入實驗室。');
        return;
    }
    document.getElementById('intro').style.display = 'none';
    document.getElementById('archimedes-overlay').style.display = 'flex';
};

document.getElementById('enter-lab-confirm').onclick = function() {
    document.getElementById('archimedes-overlay').style.display = 'none';
    document.getElementById('experiment').style.display = 'block';
    updatePumpVisual();
};

document.getElementById('continue-button').onclick = function() {
    document.getElementById('warning-overlay').style.display = 'none';
    returnCount++;
    activityLog.push({
        type: '退回',
        time: new Date().toLocaleString('zh-TW'),
        experiment: experimentCount + 1,
        params: {
            angle: document.getElementById('angle').value,
            speed: document.getElementById('speed').value,
            diameter: document.getElementById('diameter').value
        },
        detail: '使用者按下「返回實驗室」'
    });
};

document.getElementById('start-button').onclick = function() {
    const angle = document.getElementById('angle').value;
    const speed = document.getElementById('speed').value;
    const diameter = document.getElementById('diameter').value;
    const currentParams = { angle, speed, diameter };

    if (lastParams) {
        let changedCount = 0;
        if (currentParams.angle !== lastParams.angle) changedCount++;
        if (currentParams.speed !== lastParams.speed) changedCount++;
        if (currentParams.diameter !== lastParams.diameter) changedCount++;
        if (changedCount >= 2) {
            failedAttempts++;
            activityLog.push({
                type: '失敗',
                time: new Date().toLocaleString('zh-TW'),
                experiment: experimentCount + 1,
                params: currentParams,
                detail: '同時更改至少兩個變因，實驗未啟動'
            });
            document.getElementById('warning-overlay').style.display = 'flex';
            return;
        }
    }

    // 觸發動畫：螺紋滾動 + 水滴被帶上去 + 馬達旋轉
    const scene = document.getElementById('pump-scene');
    scene.style.setProperty('--dur', SPEED_DURATION[speed]);
    document.getElementById('pump-tube-wrapper').classList.add('running');
    document.getElementById('crank-motor').classList.add('running');

    setTimeout(function() {
        document.getElementById('pump-tube-wrapper').classList.remove('running');
        document.getElementById('crank-motor').classList.remove('running');

        const efficiency = computeEfficiency(angle, speed, diameter);

        const resultsTable = document.getElementById('data-table').getElementsByTagName('tbody')[0];
        const newRow = resultsTable.insertRow();
        newRow.insertCell(0).innerText = experimentCount + 1;
        newRow.insertCell(1).innerText = angle;
        newRow.insertCell(2).innerText = speed;
        newRow.insertCell(3).innerText = diameter;
        newRow.insertCell(4).innerText = efficiency;

        experiments.push({ angle, speed, diameter, efficiency });
        experiments[experiments.length - 1].time = new Date().toLocaleString('zh-TW');
        lastParams = currentParams;
        experimentCount++;

        document.getElementById('results').style.display = 'block';

        if (experimentCount >= 3) {
            document.getElementById('discuss-results').disabled = false;
            document.getElementById('hint').style.display = 'none';
        }
    }, 1600);
};

document.getElementById('discuss-results').onclick = function() {
    document.getElementById('experiment').style.display = 'none';
    document.getElementById('discussion').style.display = 'block';
    drawCharts();
};

/* 「再試一次」：清除本輪數據，從零開始 */
document.getElementById('retry-button').onclick = function() {
    document.getElementById('discussion').style.display = 'none';
    document.getElementById('experiment').style.display = 'block';
    experiments = [];
    experimentCount = 0;
    lastParams = null;
    document.getElementById('data-table').getElementsByTagName('tbody')[0].replaceChildren();
    document.getElementById('results').style.display = 'none';
    document.getElementById('discuss-results').disabled = true;
    document.getElementById('hint').style.display = 'block';
    document.getElementById('angle').value = '45';
    document.getElementById('speed').value = 'low';
    document.getElementById('diameter').value = '6';
    chartInstances.forEach(chart => chart.destroy());
    chartInstances = [];
    updatePumpVisual();
};

document.getElementById('export-results').onclick = exportExperimentPdf;
document.getElementById('export-pdf').onclick = exportExperimentPdf;

async function exportExperimentPdf() {
    if (!window.html2canvas || !window.jspdf) {
        alert('PDF 匯出元件載入失敗，請確認網路連線後重試。');
        return;
    }

    const speedNames = { low: '低速', medium: '中速', high: '高速' };
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[character]);
    const report = document.createElement('div');
    report.style.cssText = 'position:fixed;left:-10000px;top:0;width:760px;padding:36px;background:#fff;color:#222;font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;box-sizing:border-box;';
    report.innerHTML = `
        <h1 style="font-size:28px;margin:0 0 8px;">阿基米德螺旋抽水器實驗紀錄</h1>
        <p style="font-size:14px;margin:0 0 20px;">匯出時間：${new Date().toLocaleString('zh-TW')}</p>
        <h2 style="font-size:20px;margin:20px 0 8px;">學生資料</h2>
        <p style="font-size:16px;line-height:1.8;margin:0;">班級：${escapeHtml(studentInfo.className)}<br>座號：${escapeHtml(studentInfo.seatNumber)}<br>姓名：${escapeHtml(studentInfo.name)}</p>
        <h2 style="font-size:20px;margin:20px 0 8px;">紀錄摘要</h2>
        <p style="font-size:16px;line-height:1.8;margin:0;">完成實驗：${experiments.length} 次<br>失敗：${failedAttempts} 次<br>退回：${returnCount} 次</p>
        <p style="font-size:13px;color:#555;line-height:1.7;">失敗定義：同時更改至少兩個變因，導致實驗未啟動。退回次數依使用者按下「返回實驗室」計算。</p>
        <h2 style="font-size:20px;margin:20px 0 8px;">完成的實驗</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr><th>編號</th><th>時間</th><th>夾角</th><th>轉速</th><th>半徑</th><th>輸水效率</th></tr></thead>
            <tbody>${experiments.map((item, index) => `<tr><td>${index + 1}</td><td>${item.time || '-'}</td><td>${item.angle} 度</td><td>${speedNames[item.speed]}</td><td>${item.diameter} 公尺</td><td>${item.efficiency}%</td></tr>`).join('')}</tbody>
        </table>
        <h2 style="font-size:20px;margin:20px 0 8px;">失敗與退回明細</h2>
        ${activityLog.length ? `<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th>類型</th><th>時間</th><th>實驗編號</th><th>當時設定</th><th>說明</th></tr></thead><tbody>${activityLog.map(item => `<tr><td>${item.type}</td><td>${item.time}</td><td>${item.experiment}</td><td>${item.params.angle} 度 / ${speedNames[item.params.speed]} / ${item.params.diameter} 公尺</td><td>${item.detail}</td></tr>`).join('')}</tbody></table>` : '<p style="font-size:14px;">目前沒有失敗或退回紀錄。</p>'}
        <style>
            th,td { border:1px solid #bbb; padding:7px; text-align:left; vertical-align:top; }
            th { background:#edf2f5; }
            tr { break-inside:avoid; }
        </style>`;
    document.body.appendChild(report);

    try {
        const canvas = await html2canvas(report, { scale: 2, backgroundColor: '#ffffff' });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const margin = 10;
        const pageWidth = pdf.internal.pageSize.getWidth() - margin * 2;
        const pageHeight = pdf.internal.pageSize.getHeight() - margin * 2;
        const sliceHeight = Math.floor(canvas.width * pageHeight / pageWidth);

        for (let offset = 0, page = 0; offset < canvas.height; offset += sliceHeight, page++) {
            if (page > 0) pdf.addPage();
            const currentHeight = Math.min(sliceHeight, canvas.height - offset);
            const pageCanvas = document.createElement('canvas');
            pageCanvas.width = canvas.width;
            pageCanvas.height = currentHeight;
            pageCanvas.getContext('2d').drawImage(canvas, 0, offset, canvas.width, currentHeight, 0, 0, canvas.width, currentHeight);
            pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', margin, margin, pageWidth, currentHeight * pageWidth / canvas.width);
        }

        pdf.save('阿基米德螺旋抽水器實驗紀錄.pdf');
    } catch (error) {
        console.error('PDF 匯出失敗：', error);
        alert('PDF 產生失敗，請稍後再試。');
    } finally {
        report.remove();
    }
}

function drawCharts() {
    // 若之前已畫過圖，先銷毀避免重疊
    chartInstances.forEach(c => c.destroy());
    chartInstances = [];

    const speedOrder = { low: 1, medium: 2, high: 3 };
    const sorted = key => experiments.slice().sort((a, b) => {
        const aValue = key === 'speed' ? speedOrder[a.speed] : Number(a[key]);
        const bValue = key === 'speed' ? speedOrder[b.speed] : Number(b[key]);
        return aValue - bValue;
    });
    const scatterOptions = title => ({
        responsive: true,
        scales: {
            x: {
                type: 'linear',
                title: { display: true, text: title },
                ticks: title === '轉速' ? {
                    stepSize: 1,
                    callback: value => ({ 1: '低速', 2: '中速', 3: '高速' })[value] || ''
                } : undefined
            },
            y: {
                title: { display: true, text: '輸水效率(%)' },
                beginAtZero: true
            }
        }
    });
    const createScatter = (canvasId, key, xLabel, color, valueMap) => {
        const points = sorted(key).map(item => ({
            x: valueMap ? valueMap[item[key]] : Number(item[key]),
            y: Number(item.efficiency)
        }));
        chartInstances.push(new Chart(document.getElementById(canvasId), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: '輸水效率(%)',
                    data: points,
                    borderColor: color,
                    backgroundColor: color,
                    pointRadius: 6,
                    showLine: false
                }]
            },
            options: scatterOptions(xLabel)
        }));
    };

    createScatter('chart-angle', 'angle', '夾角(度)', '#e74c3c');
    createScatter('chart-speed', 'speed', '轉速', '#3498db', speedOrder);
    createScatter('chart-radius', 'diameter', '半徑(公尺)', '#2ecc71');
}
</script>
</body>
